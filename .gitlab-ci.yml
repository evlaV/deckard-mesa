stages:
  - build

.mesa-base:
  stage: build
  variables:
    PKGDEST: "${CI_PROJECT_DIR}/local_repo"
    GIT_STRATEGY: "none"
  before_script:
    - git clone https://gitlab.steamos.cloud/deckard/deckardos/holo .
    - sed -i -e "s/_commit=.*/_commit=${CI_COMMIT_SHA}/" deckard/deckard-mesa-linux-aarch64/mesa_common.pkgbuild
    - ulimit -c 0
  artifacts:
    paths:
      - local_repo/*.pkg.tar.zst

deckard-mesa-android-aarch64_build:
  extends: .mesa-base
  image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/android-arm64-package-builder:latest
  script:
    - ./.ci_scripts/build_package.sh deckard/deckard-mesa-android-aarch64
  tags:
    - x86_64-linux-kvm-docker-heavy

deckard-mesa-linux-aarch64_build:
  extends: .mesa-base
  image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-arm64-package-builder:latest
  script:
    - ./.ci_scripts/build_package.sh deckard/deckard-mesa-linux-aarch64
  tags:
    - aarch64-linux-docker

deckard-mesa-linux-x86_64_build:
  extends: .mesa-base
  image: registry.gitlab.steamos.cloud/deckard/deckardos/holo/steamos-x86_64-package-builder:latest
  script:
    - ./.ci_scripts/build_package.sh deckard/deckard-mesa-linux-x86_64
  tags:
    - x86_64-linux-kvm-docker-heavy
